# 로컬 개발·테스트용 Postgres·Neo4j 주문서 (설계 8절·5.5, 계획 1 Task 8, 계획 3b Task 3).
# 하지 않는 일: 배포. 배포 DB는 Supabase이고 여기 비밀번호는 내 컴퓨터에서만 쓰는 값이다.
# 켜기: docker compose up -d db neo4j neo4j-test / 끄기: docker compose stop db neo4j neo4j-test
name: marvia-v2 # [왜] v1 compose와 이름을 나눠 컨테이너·볼륨이 섞이지 않게 한다
services:
  db:
    # [왜] pgvector가 미리 깔린 Postgres 16. 계획 2의 RAG 벡터 검색을 같은 DB에서 쓴다
    image: pgvector/pgvector:pg16
    environment: # DB를 처음 만들 때 쓰는 계정·DB 이름 (src/marvia/config.py 기본 주소와 같다)
      POSTGRES_USER: marvia
      POSTGRES_PASSWORD: marvia
      POSTGRES_DB: marvia
    ports:
      - "5433:5432" # 내 컴퓨터 5433번 문 → 상자 안 Postgres 5432번 문. [왜] 5432는 다른 Postgres와 겹치기 쉽다
    volumes:
      - pgdata_v2:/var/lib/postgresql/data # [왜] 상자를 지웠다 켜도 데이터가 남게 상자 밖 저장 공간에 둔다
  neo4j:
    # [왜] 법령 그래프(설계 5.5). 이미지는 digest로 고정한다(5.26.32-community, 11-06 Docker Hub). 태그는 움직인다
    image: neo4j:5.26.32-community@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    environment:
      # [주의] Neo4j 5는 8자보다 짧은 비밀번호로는 뜨지 않는다(이미지 docker-entrypoint.sh, 11-06 확인)
      NEO4J_AUTH: neo4j/marvia-local # src/marvia/config.py 기본값과 같다. 내 컴퓨터에서만 쓰는 값
    ports:
      # [왜] 127.0.0.1을 붙여야 이 컴퓨터에서만 열린다. 포트만 적으면 같은 망의 다른 기기가 기본 비밀번호로 붙는다
      - "127.0.0.1:7688:7687" # bolt. [왜] 7687은 강의 실습 Neo4j 컨테이너와 겹친다
      - "127.0.0.1:7475:7474" # 브라우저 (http://localhost:7475)
    volumes:
      - neo4jdata_v2:/data
  neo4j-test:
    # [왜] 그래프 시험 전용. 커뮤니티판은 사용자 DB가 하나라 개발 그래프와 같은 서버에 시험을 돌리면 시험이
    #      실제 노드를 지울 수 있다(품목 그래프가 지워진 사고). 같은 고정 이미지, 데이터는 남기지 않는다
    image: neo4j:5.26.32-community@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    environment:
      NEO4J_AUTH: neo4j/marvia-local
    ports:
      - "127.0.0.1:7689:7687" # bolt만. 브라우저 문은 열지 않는다
    tmpfs:
      - /data
volumes:
  pgdata_v2: {}
  neo4jdata_v2: {}
