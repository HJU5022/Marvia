# 필수 조건 2. `docker compose up` 한 줄로 전체가 뜬다.
# api와 worker는 같은 이미지에서 target만 다르게 만든다 (SDD 6.1).
# MCP(/mcp)는 api 안의 경로다. 따로 도는 mcp 서비스는 09-29에 뺐다 (SDD 5.9)
services:
  api:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Apple Silicon에서 이미지가 안 뜨면 주석을 푼다
    # platform: linux/amd64

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      # 워커는 psycopg를 쓴다. api의 asyncpg 주소와 같은 DB다
      DATABASE_URL: postgresql://app:app@db:5432/app
      # 지켜보는 화물 재판정(WATCH_ENABLED=on, G5)이 MCP 도구를 부를 주소. 워커 컨테이너에는 자기 안에 api가 없어
      # Dockerfile의 127.0.0.1 기본값이 닿지 않으므로 api 서비스를 가리킨다
      MCP_URL: http://api:8000/mcp
    depends_on:
      db:
        condition: service_healthy
    # restart를 두지 않는다. 스케줄러가 꺼져 있으면(기본) 안내를 남기고 끝나야 하기 때문이다
    # platform: linux/amd64

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
