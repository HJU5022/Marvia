# API 키·비밀번호가 커밋되면 실패하는 자동 검사.
# 실패 시: 키가 커밋된 것 → 즉시 강사에게 알리고 해당 키를 재발급하세요.
# (히스토리에 남은 키는 삭제해도 유출된 것으로 간주합니다)
#
# push는 main만 본다 — PR 브랜치에 커밋할 때마다 push+pull_request 이벤트가
# 겹쳐 두 번씩 돌던 것을 없앤다(2026-08-21, Actions 무료 한도 소진 대응).
# PR은 여전히 모든 커밋마다 검사하므로 머지 전 탐지 능력은 그대로다.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-banner --redact -v
