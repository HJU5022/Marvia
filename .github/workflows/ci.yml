# v2 브랜치 검사 (done 3.6, 설계 11절·13절). 키 없이 돈다: 린트, 형식, 타입, 시험(평가셋 동결·지표·평가 문 포함).
# 평가 문은 저장소에 둔 실행 결과(파생 값)를 지금 코드로 다시 채점해 rules/eval.yaml의 바닥값과 비교한다(재생 채점).
# 실제 모델을 다시 부르지 않는다: 실제 응답은 저장소에 넣지 않으므로 응답을 재생할 수 없다 (CLAUDE.md).
name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # [왜] DB 시험(색인·검색·대화 기록·감시 표)도 돌린다. 로컬과 같은 이미지에 같은 계정이다(docker-compose.yml)
    services:
      db:
        # pgvector/pgvector:pg16 (여러 구조 묶음의 해시. 올릴 때는 새 해시로 바꾼다)
        image: pgvector/pgvector@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: marvia
          POSTGRES_PASSWORD: marvia
          POSTGRES_DB: marvia
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marvia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MARVIA_DATABASE_URL: postgresql://marvia:marvia@localhost:5433/marvia
    steps:
      # [주의] 바깥 액션은 커밋 해시로 고정한다. 태그는 옮겨질 수 있다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 이후 단계에 저장소 자격 증명을 남기지 않는다
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.30" # 로컬 Docker 검사와 같은 uv
          enable-cache: true
      - run: uv sync --locked # 잠금 파일이 pyproject와 어긋나면 실패한다
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
        env:
          MARVIA_REQUIRE_DB: "1" # DB에 못 닿으면 DB 시험을 건너뛰지 않고 실패시킨다
