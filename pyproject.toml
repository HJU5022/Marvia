[project]
name = "marvia"
version = "2.0.0a0"
description = "어떤 단서로든 수입 화물을 찾아 법령 근거와 함께 다음 할 일을 알려 주는 에이전트"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "kiwipiepy>=0.24.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "onnxruntime>=1.31.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rapidocr>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# relay/는 v1에서 그대로 둔 배포 중인 해수부 릴레이라 v2 린트 대상에서 뺀다
extend-exclude = ["relay"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
