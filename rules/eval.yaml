# 평가 설정값. 코드(src/marvia/eval, scripts/run_eval.py)와 시험이 읽는다 (설계 11절, done 3장).

set:
  groups: {related: 15, unrelated: 10, blocked: 5} # 갈래별 문항 수 (설계 11절)
  human: 10 # 사람 채점 문항 수 (설계 11절)
  # 평가셋에 쓸 수 있는 화물 번호 접두어. fixtures/unipass/의 가공 번호와 없는 번호(NOPE)뿐이다 (CLAUDE.md)
  number_prefixes: [DEMO, MOCK, TEST, NOPE]


retrieval_k: 8 # 검색 R@k의 k. [왜] RAG 한 번이 리랭커 상위 8개를 남긴다 (rules/rag.yaml rerank_top_n)

# 요약(metrics.summarize)에 내는 문항당 LLM 호출 수·토큰 수의 백분위와, 재지 않은 칸에 적는 말
summary:
  percentiles: [50, 95] # 가까운 순위 법(값을 줄 세워 ceil(q/100 × n)번째)
  # claude -p(MARVIA_LLM_VIA=cli)로 잰 실행의 비용·시간 칸. [왜] 청구액이 없고 시간에 CLI 시작 시간이 섞인다
  not_measured: 재지 않음

run:
  # 실행 한 번(scripts/run_eval.py run)의 유료 호출 상한(달러). 다음 문항 전에 쓴 돈이 이 값을 넘으면 멈춘다
  max_cost_usd: 1.0
  # claude -p 실패(사용량 한도, 로그인, 시간 초과)가 난 문항이 이 수에 닿으면 실행을 멈추고 무효로 둔다.
  # [왜] 이런 실패는 다음 문항에서도 되풀이된다. 남은 문항을 오류로 채우며 한도가 걸린 구독을 계속 부르지 않는다
  cli_failure_rows: 1

# 돈이 드는 실행 전에 보이는 어림 비용의 문항당 토큰 수.
# [왜] 계획 3d 손 시험(11-06, 에이전트 길 세 차례): 입력 189,722 / 출력 13,501 토큰 → 차례당 약 63,000 / 4,500
estimate:
  input: 63000
  output: 4500

ragas:
  contexts: 8 # ragas에 넘기는 근거 글 수(RAG 재순위 `retrieved` 순서의 앞 8개). [왜] context precision은 근거마다 LLM을 한 번 부른다
  metrics: [faithfulness, context_precision, context_recall]
  contexts_rule: cited+calc # 점수 파일 meta에 남기는 맥락 규칙 이름: 충실도는 인용 조문+계산·화물 줄, 정밀도·재현율은 검색 순위 앞쪽, 계산 문항도 셈 (계획 4a 문서 ragas 절)

# LLM 채점 (ragas, 설계 11절). 채점 모델은 답을 쓴 모델과 다르다
judge:
  model: claude-sonnet-5-5
  # ragas faithfulness를 사람 채점 칸(1, 0.5, 0)으로 나누는 하한. [0.8 이상 → 1, 0.5 이상 → 0.5, 그 밖 0]
  buckets: [0.8, 0.5]
  # 사람 채점 10건과 이 비율 이상 같은 칸이면 LLM 채점을 머리 숫자로 쓴다. [왜] v1 대조가 5건 중 4건 일치였다
  min_agreement: 0.8
  unchecked_label: LLM 채점, 사람 일치 미확인 # 일치율을 보기 전 ragas 숫자에 붙이는 말
  # ragas 한 번 부를 때의 어림 토큰 수 (scripts/ragas_score.py --dry-run). [추정] 근거 8개를 이은 판정 프롬프트 기준
  call_tokens: {input: 2500, output: 300}
  max_cost_usd: 1.5 # ragas 실행 한 번의 상한(달러)

# CI 문 (done 3.6): 기준 실행(커밋 c2c068d)에서 한 문항만큼 둔 바닥·천장값.
# 새 기준 실행을 커밋할 때만 다시 만든다. 결과를 보고 값을 낮추지 않는다
gate:
  file: eval/results/agent-claude-haiku-5-5-v2r1.json
  set: v2
  floors:
    errors:
      max: 0
    leaks:
      max: 0
    cap_breaches:
      max: 0
    correct_citation:
      min: 0.74
    behaviour_accuracy:
      min: 0.89
    blocked_accuracy:
      min: 0.8
    calc_accuracy:
      min: 0.8
    mrr:
      min: 0.29
    trajectory:
      min: 0.93
    recall_at_8:
      min: 0.45
    wrong_evidence:
      max: 0.29
    unsupported:
      max: 0.07
    false_not_found:
      max: 0.09
  rulings:
  - date: '2026-11-06'
    metric: mrr
    old: 0.33
    new: 0.29
    reason: '새 판 v2의 첫 문: 문 파일은 실행 전에 agent v2r1로 정했고 세 실행 가운데 고르지 않았다(계획 4a-2 Task
      4). v1 문과 판이 달라 값을 견주어 낮춘 것이 아니다'

# 수퍼바이저 길과 에이전트 길의 비교 판정 (계획 7b). 11-12에 수퍼바이저 코드를 쓰기 전에 고정했다.
# 결과를 본 뒤에는 고치지 않는다. 코드(src/marvia/eval/metrics.py compare_paths)가 읽는다
comparison:
  runs: 5 # 길마다 실행 수. [왜] 세 번으로는 한 문항 차이를 가르지 못했다(저장된 줄을 다시 뽑아 본 값)
  majority: 3 # 다섯 번 가운데 이 횟수 이상 맞은 문항을 "맞은 문항"으로 센다
  margin_items: 2 # 맞은 문항 수가 이만큼 많아야 이김, 이만큼 적으면 짐. 한 문항 차이는 구분 못 함이다
  slack_items: 1 # "낮지 않음" 줄의 폭: 다섯 번 평균이 한 문항 몫(1/분모)만큼 낮아도 낮지 않다고 본다
  max_call_ratio: 1.5 # 모든 줄의 LLM 호출 중앙값이 에이전트 길의 이 배수를 넘지 않아야 한다
  # 상한에 닿아 끝난 줄 수(다섯 실행 합, metrics.cap_stops)의 폭: 수퍼바이저 ≤ 에이전트 + 이 값.
  # [왜] 드문 사건의 수라 폭 없이 견주면 한 줄 차이로 갈린다. 넘으면 이김이 아닐 뿐 짐은 아니다 (11-13 고침)
  cap_stop_slack: 3
  # 사전 검사: 비교에 쓴 LLM 길로 돌린 에이전트 길 다섯 번의 평균이 저장된 실행의 범위 안인가.
  # [주의] 저장 값은 Anthropic API로 잰 것이고(커밋 87d92e8의 t1~t3, 평가셋 v2 기준) 비교 실행은 다른 길
  #        (claude -p)로 돌 수 있다. 조건이 다른 두 측정을 견주는 검사다. 벗어나도 판정은 내되
  #        모든 숫자에 그 사실을 적는다
  precheck:
    set: v2 # 저장 값을 잰 기준. 같은 기준으로 세어 견준다
    slack_items: 1 # 범위를 아래위로 한 문항 몫(1/분모)만큼 넓힌다
    behaviour_accuracy: {min: 0.9, max: 0.9} # eval/results/agent-claude-haiku-5-5-t1~t3.json
    correct_citation: {min: 0.6667, max: 0.8333}

# 에이전트 길 도구 호출 궤적 검사 (done 3.4). 문항별 조건은 eval/set_v1.yaml의 trajectory
trajectory:
  # 어느 문항에서도 부르면 안 되는 도구. [왜] 평가셋에 저장·감시를 부탁하는 문항이 없다
  never: [save_item_card, save_preference, watch_cargo]
  # 문항에 상한이 없을 때의 도구 호출 수 상한(할 일 갱신 write_todos 포함). [추정] 시작값이다:
  # 한 차례 검색 상한 3(rules/agent.yaml max_searches)에 화물 조회·계산·조문 조회·할 일 갱신을 더해 넉넉히 둔다
  max_calls: 12
  # 법령 근거를 찾는 도구(검색, 조문 조회, 조사 서브에이전트). 정답 근거가 있는 문항이 이 가운데 하나도
  # 부르지 않고 끝난 수를 요약에 낸다. [왜] 도구 길이 조용히 죽은 실행이 오류 0으로 끝난 일이 있었다 (11-12)
  search_tools: [search_law, get_provision, research]

# 11-02 RAG 관찰 세 가지를 재는 값 (done 3.3)
rag_observations:
  top: 8 # 한 조문 쏠림을 볼 근거 수 (리랭커 상위 8개, rules/rag.yaml rerank_top_n)
  alert: 0.75 # 한 조문이 이 몫 이상이면 쏠림으로 센다. [왜] 11-02 관찰은 8개 중 7개(0.875)였다

# 범용 도구 비교 (done 3.8, eval/domain_protocol.md). 같은 질문과 같은 가공 화물 파일을 준다
domain:
  # 범용 도구에게 줄 글. {as_of}와 {question}을 채운다 (scripts/run_eval.py domain-prompts)
  prompt: |-
    오늘은 {as_of}입니다. 이 폴더의 unipass/ 아래 JSON 파일은 화물 번호별 UNI-PASS 화물통관진행정보 조회 결과를 옮긴 것입니다(stage는 통관 단계, stage_at은 그 단계가 된 시각).
    아래 질문에 한국어로 답해 주세요. 기한이 있으면 날짜를 적고, 근거가 되는 법령 이름과 조문 번호를 함께 적어 주세요.

    질문: {question}
