# 검증자가 막는 표현. 코드(src/marvia/graph/verify.py)가 읽는다 (설계 6.5 금지 규칙, 1절 하지 않는 일).
# pattern은 파이썬 정규식이다. 하나 더할 때마다 tests/graph/test_verify.py에 걸리는 예와 걸리지 않는 예를 하나씩 더한다.
# [왜] 작은따옴표로 감싼다. 큰따옴표 안에서는 yaml이 \s 같은 역슬래시를 먼저 풀어 버린다

forbidden:
  # 통관이 된다·안 된다·가능하다고 단정. "가능한지/될지는 관세사에게"처럼 묻는 말은 걸리지 않는다
  - pattern: '통관(이|은|도|에)?\s*(가능|불가능|불가)(?!성|한지|하신지|할지|\s*여부)'
    reason: 통관 가부를 단정했다
  - pattern: '통관(이|은|도)?\s*(안\s*)?(됩니다|돼요|될\s*(거|것|겁|수)|되겠)'
    reason: 통관 가부를 단정했다
  - pattern: '통관(에|이|은)?\s*(아무\s*)?문제\s*(가\s*)?없(?!는지|을지)'
    reason: 통관 가부를 단정했다
  # HS 코드·품목번호·세번 뒤에 숫자 네 자리 이상을 쓰면 확정으로 본다
  - pattern: '(HS|품목번호|세번)\s*(코드|부호)?\s*(는|은|가|이|를|을|로|으로)?\s*\d{4}(?!\s*년)'
    reason: HS 코드를 확정했다
# 세액(원 단위 금액)은 정규식 대신 코드가 계산 결과의 금액과 대조한다 (src/marvia/graph/verify.py)

# 재수입 검사 결과 말하기 (설계 7.1: 코드 판정(reimport_check)만 말하고 면제는 단정하지 않는다).
# 코드(src/marvia/graph/verify.py)가 문장마다 본다. 키는 calc.reimport.verdict와 같고,
# 면제는 코드 판정이 없어 늘 위반이다.
# 결과 말 뒤(같은 문장)에 negation이 오면(단정할 수 없다 같은 말) 결과를 말한 것으로 세지 않는다.
# 하나 더할 때마다 tests/graph/test_verify.py에 걸리는 예와 걸리지 않는 예를 하나씩 더한다.
reimport_verdicts:
  negation: '수\s*없|아니|않|못|모르'
  # 결과 말 뒤의 부정을 찾을 때 이 경계에서 자른다.
  # [왜] 다른 절의 부정("충족하지만 확정은 아니에요")이 앞 절의 결과 말을 지우지 못하게 한다
  clause_end: '[,;]|지만|는데|으나'
  phrases:
    서류검사 요건 충족:
      - '서류검사\s*요건\s*(을|이)?\s*(충족(?!하려|하면|해야|하는지|할지)|채워(?!야)|채웠|갖춰(?!야)|갖췄)'
    정밀검사 대상:
      - '정밀검사\s*대상\s*(이에요|입니다|이라|이므로|이고|이네요|으로\s*(나왔|판정|분류))'
    면제:
      - '면제\s*(받을\s*수\s*있|됩니다|돼요|되어요|예요|입니다)'
