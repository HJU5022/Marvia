# 판정 표 재료. 코드(src/marvia/tools/verdict.py)가 읽는다 (설계 7.1).
# 신호 이름과 6시간·12시간·24시간 같은 신호 기준은 v1 skills/ais-reliability/rules.md를 따른다 (태그 v1-final).
# 등급을 넷으로 나누고 신호 배치를 정한 것은 10-29 결정이다 (설계 2절 결정 13).

# 하나라도 켜지면 긴급: 통관 검사·보류·정지·반송·폐기
act_signals: [customs_hold]
# 하나라도 켜지면 경계: 항구 앞 장시간 정지, 목적지가 도착 항구가 아닌 곳으로 바뀜
alert_signals: [anchor_wait, dest_changed]
# 켜지면 주의: 위치 끊김, 배 신호 ETA와 해수부 입항 예정의 차이
watch_signals: [position_stale, eta_conflict]
# 주의 신호가 이 개수 이상 함께 켜지면 경계
watch_to_alert_count: 2
# 판매 예정일까지 여유가 이 일수 미만이면 경계 (0 미만, 즉 넘김이면 긴급)
margin_alert_days: 2

# 입력 오류일 수 있는 신호. 등급은 올리지 않고 확신을 "부분"으로 낮춘다
input_error_signals: [navstat_mismatch]
# dest_changed가 이 값이면 입력 오류로 본다 (깨진 목적지, 빈 목적지)
input_error_dest_values: [broken, empty]

# 일정 칸: 이 신호가 켜지면 "우려"
schedule_concern_signals: [eta_conflict, anchor_wait]
# 일정 칸: 믿을 ETA가 처음 알던 ETA보다 이 일수 이상 늦으면 "지연"
delay_days: 1
