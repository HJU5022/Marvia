# 에이전트 흐름 설정값. 코드(src/marvia/graph/main.py, answer.py, src/marvia/llm.py)가 읽는다 (설계 6.4·6.5).
# 숫자는 계획 3a의 시작값이고 계획 4 평가 결과를 보고 고친다.

llm:
  timeout_s: 60 # LLM 호출 한 번의 시간 제한(초). ChatAnthropic 기본값은 제한 없음이라 꼭 둔다 (11-02 실측)
  max_retries: 2 # Anthropic SDK 재시도 횟수(429·5xx·연결 오류). SDK 기본값과 같다
  # `claude -p` 호출 한 번의 시간 제한(초, MARVIA_LLM_VIA=cli). [왜] CLI 시작과 구조화 출력의 요청 두 번이 더해진다.
  # 11-12 실측: 호출 51회 가운데 가장 긴 것이 16.1초였다. 넘으면 프로세스를 죽이고 그 호출은 실패다
  cli_timeout_s: 180
  # `claude -p` 프로세스(와 그 아래 도구 스텁)에 넘기는 환경 변수 이름. 나머지는 물려주지 않는다(키, DB 주소).
  # [왜] 11-13 실측: 이 셋이면 돈다. USER가 없으면 로그인 정보를 읽지 못해 "Not logged in"으로 끝난다
  cli_env: [PATH, HOME, USER]

loop:
  # 한 차례 LLM 호출 상한 (설계 6.4). 계획자 길: 계획자 다음 갈림길에서 닿았으면 finish.
  # 에이전트 길: 루프의 모델 호출과 search_law 안의 RAG 호출을 합친 상한이고, 모델을 부르기 전과 검색하기 전에 지킨다.
  #   작성자 호출은 answer.max_write_attempts가 따로 막는다 (한 차례 최대 = 이 값 + max_write_attempts)
  max_llm_calls: 20
  # 계획자 다음에 남아 있어야 할 그래프 단계 수. 모자라면 finish.
  # [왜] 6 = 갈림길이 보는 남은 단계에 plan 자신이 들어 있어 1 + (write → verify → write → verify → finish 5).
  #      answer.max_write_attempts를 바꾸면 2 × 그 값 + 2로 바꾼다 (11-02 검증에서 5는 경계에서 모자랐다)
  min_remaining_steps: 6
  recursion_limit: 40 # 한 차례의 그래프 단계 상한 (LangGraph 기본값 10007은 사실상 무제한, 11-02 실측)
  # 한 단계에 함께 도는 작업 수 상한 (화물 조회 갈래, 병렬 도구 호출). 서브그래프에도 같이 걸린다(11-06 실측).
  # [왜] 바깥 API(UNI-PASS·Voyage)의 요청 한도(429)를 넘지 않게 한다 (강의 IV 13강). 시작값이다
  max_concurrency: 4
  # 에이전트 루프 길의 단계 상한. [왜] 루프 한 바퀴가 모델·미들웨어 노드·도구로 여러 단계를 쓴다.
  #      LLM 호출 상한(max_llm_calls)이 먼저 닿도록 넉넉히 둔다. 호출 한 번에 약 7단계,
  #      상한 20이면 142 이상이어야 한다(11-06 실측). max_llm_calls를 올리면 이 값도 올린다
  #      시험: tests/graph/test_agent.py
  #            test_cheap_tool_loop_hits_the_llm_cap_before_the_recursion_limit
  agent_recursion_limit: 200
  # 에이전트 길의 RAG 한 번 안에서 질의를 고쳐 쓰는 최대 횟수. 계획자 길은 rules/rag.yaml(2)을 쓴다.
  # [왜] 에이전트 길은 모델이 직접 다시 찾으므로 고쳐 쓰기 반복이 겹쳐 돈다
  #      (11-06 비교: 법령 질문 LLM 호출 17-19회)
  rag_rewrites: 1
  # 에이전트 루프 한 차례의 법령 검색 상한. 넘는 호출은 오류 결과를 받는다.
  # [왜] 11-06 손 시험에서 같은 질의를 네 번 반복했고, 11-06 비교에서 법령 질문이 검색 5번을 불렀다.
  #      4에서 3으로 줄인다
  max_searches: 3
# 조사 서브에이전트 (계획 3d). 법령 검색·조문 조회만 하는 두 번째 루프이고 부모와 LLM 호출 상한을 함께 쓴다
research:
  max_summary: 400 # 부모에게 돌려주는 요약 글 상한(글자). [왜] 서브에이전트의 값어치는 부모 기록을 짧게 두는 데 있다
# 수퍼바이저 길 (계획 7b, MARVIA_LOOP=supervisor). 수퍼바이저는 일을 나눠 맡기고, 묻고, 거절만 한다
supervisor:
  tools: [ask_user, decline] # 수퍼바이저가 직접 부르는 도구. 할 일 목록(write_todos)은 미들웨어가 더한다
# 색인 밖 공식 출처 조회 (계획 3d, 설계 2절 결정 8의 C층). 키 없이 법령 이름으로 국가법령정보센터 페이지를 찾는다
official:
  allowed_hosts: [www.law.go.kr] # 부를 수 있는 사이트. [왜] 정부 공식 출처만 (설계 12절)
  max_title: 80 # 답에 보일 제목 글자 수 상한. [왜] 페이지 글은 데이터라 길게 옮기지 않는다
  timeout_s: 10 # 한 번 조회의 시간 제한(초)

answer:
  # 작성자 호출 상한. 검증 위반이면 한 번 고치게 하고, 또 위반이면 부분 답으로 간다 (설계 6.5)
  max_write_attempts: 2
  # 작성자·검증자가 보는 근거 묶음 상한(점수 높은 순). [왜] 검색마다 리랭커 상위 8개(rules/rag.yaml)가 더해져
  # 끝없이 커지면 작성자 프롬프트가 커진다. 24 = 검색 세 번 몫 (11-06 손 시험: 검색 네 번에 14개)
  max_evidence: 24

# 승인 (설계 6.3). ask: 권한 모드가 ask일 때 승인을 받을 도구. always_ask: auto 모드에서도 늘 묻는 도구
# [주의] 밖으로 나가는 메시지 도구가 생기면 always_ask에 넣는다 (설계 12절: auto는 바깥 발송을 덮지 않는다)
approval:
  ask: [] # 권한 모드가 ask일 때만 묻는 도구용. 지금은 없다
  # 장기 기억과 감시 목록에 쓰는 도구는 auto에서도 늘 묻는다 (설계 8절·12절: 남는 일은 승인 뒤에만)
  always_ask: [save_item_card, save_preference, watch_cargo, unwatch_cargo]
  # 승인 카드 글에 쓰는 도구 한국어 이름 (화면 카드의 이름과 같다). 없는 도구는 영어 이름 그대로 보인다
  labels:
    save_preference: 설명 깊이 저장
    save_item_card: 품목 카드 저장
    watch_cargo: 화물 감시 추가
    unwatch_cargo: 화물 감시 해제

# 장기 기억 저장 기준 (설계 8절). 품목 카드 이름은 짧은 품목 이름만 받는다
memory:
  max_item_name: 20 # 품목 카드 이름 글자 수 상한. [왜] 길거나 문장처럼 생긴 이름은 지시문이 섞일 수 있다
  # 이름에 들어 있으면 문장으로 보고 거절하는 글자 (마침표·물음표·느낌표·쌍점·쌍반점·줄바꿈)
  forbidden_marks: [".", "?", "!", ":", ";", "\r", "\n"]
  depths: [짧게, 보통, 자세히] # 저장할 수 있는 설명 깊이 (Store ("users", uid, "prefs")의 depth)
  default_depth: 보통 # 저장한 설정이 없을 때 작성자에게 주는 깊이
  max_recall: 10 # recall_memory가 한 번에 돌려주는 품목 카드 수 상한 (도구 결과가 길어지지 않게)
  # 긴 대화 요약 (계획 3d). 차례를 시작할 때 기록이 이 토큰 수(어림셈)에 닿으면 앞부분을 요약 하나로 바꾼다.
  # [왜] 기록을 그대로 두면 차례마다 입력 토큰이 늘어 비용이 커진다. 값은 시작값이고 계획 4에서 고친다
  summary_trigger_tokens: 12000
  # 요약하지 않고 그대로 두는 최근 메시지 수. 도구 호출과 그 결과는 라이브러리가 짝을 지어 함께 둔다
  summary_keep_messages: 12
  # 요약기에 주는 기록 글의 글자 수 상한. 넘으면 앞 요약은 두고 그 뒤 기록의 앞쪽을 뺀다 (R-037).
  # [왜] 상한이 없으면 아주 긴 붙여넣기가 든 기록은 요약 호출이 모델 문맥을 넘어 매 차례 실패한다.
  #      토큰 어림셈(3.3글자/토큰)은 한글 토큰을 적게 세어 글자 수로 둔다. 보통 요약 입력(요약 기준 12000
  #      어림 토큰, 약 4만 자)보다 크게 잡은 시작값이고 계획 4에서 고친다
  summary_max_input_chars: 60000

# 도메인 밖 질문에 코드가 쓰는 답 (설계 1절 범위(해상 수입 화물·통관·수입식품))
scope:
  decline: 이 질문은 Marvia가 도울 수 있는 범위 밖이에요. Marvia는 수입 화물과 통관·수입식품 규정만 다뤄요.
  can_do:
    - B/L 번호나 화물관리번호로 지금 통관 단계와 법정 기한 확인
    - 수입신고·검사·재수입 같은 절차를 법령 조문 근거와 함께 설명
    - 번호를 모를 때 포워더에게 보낼 문의 문장 만들기

finish:
  # 부분 답 끝에 늘 붙이는 다음 선택지 (설계 2절 결정 4의 ③)
  next_options:
    - 질문을 좁혀 다시 묻기 (법령 이름이나 조문 번호를 함께 적기)
    - B/L 번호나 화물관리번호를 확인해 다시 조회하기
    - 위 "빠진 근거"를 관세사에게 묻기
