# RAG 설정값. 코드(src/marvia/rag, src/marvia/graph/rag.py)가 읽는다 (설계 5.3·5.4).
# 숫자는 계획 2의 시작값이고, 계획 4 평가 결과를 보고 고친다.

# 키워드로 남길 Kiwi 품사. NNG 일반명사, NNP 고유명사, SL 외국어, SH 한자, XR 어근, VV 동사, VA 형용사
keyword_tags: [NNG, NNP, SL, SH, XR, VV, VA]

index:
  batch: 64 # 임베딩 API 한 번에 보낼 단위 수
  workers: 4 # 맥락 문장을 동시에 만들 LLM 호출 수. 계정의 분당 호출 한도에 맞춘다

search:
  vector_k: 20 # 벡터 검색에서 가져올 개수
  keyword_k: 20 # 키워드 검색에서 가져올 개수
  rrf_k: 60 # RRF 상수. 클수록 1등과 10등의 점수 차이가 줄어든다 (RRF 논문의 기본값)
  rerank_top_n: 8 # 리랭커가 다시 줄 세운 뒤 근거로 남길 개수
  # 검색 질의가 "법령 이름 + 제N조(의M)"로 조문을 지목하면 조문 직접 조회(rag/provision.py) 결과를 후보 맨 앞에 둔다.
  # [왜] 벡터·키워드 다리는 조 번호를 잘 가르지 못한다: 조문을 지목한 20문항 가운데 3문항은 정답이 후보에도
  #      없었고, 같은 조회는 이름표만 다듬어 주면 20문항을 모두 찾았다 (11-12 실측). 조 번호가 없는 질의는 그대로다
  # 리랭커에 넘기는 글 앞에 법령 이름을 붙인다("법령 이름 + 줄바꿈 + 본문"). 근거로 남는 글은 본문 그대로다.
  # [왜] 본문에는 법령 이름이 없어 리랭커가 "특별법 제45조"와 "특별법 시행규칙 제45조"를 가르지 못했다.
  #      임베딩 글에는 머리글이 들어가는데 리랭커 글에는 없었다. 따로 뽑은 조문 지목 20문항에서
  #      R@8 0.95 → 1.00, MRR 0.75 → 1.00이고 자연어 20문항은 그대로였다 (11-13 실측, 리랭커 입력 약 3% 늘어남)
  rerank_law_name: true
  named_article:
    enabled: true
    max_units: 8 # 앞에 두는 단위 수 상한(질의 하나). [왜] 근거로 남는 수(rerank_top_n)보다 많이 넣어도 쓰이지 않는다

loop:
  max_rewrites: 2 # 근거가 부족할 때 질의를 고쳐 다시 찾는 최대 횟수 (설계 5.4의 6번)

provision:
  # 조문 직접 조회(get_provision)의 법령 이름 줄임말. 계산 도구(rules/reimport.yaml)가 "시행규칙 별표 9 …"로 쓴다
  law_alias:
    시행규칙: 수입식품안전관리 특별법 시행규칙

mcp:
  max_query: 300 # search_regulations 질의 글자 수 상한
