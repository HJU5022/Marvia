# 검색 전용 평가셋 rset_b2: 자연어 질문 20문항 (리랭커 입력을 바꾸기 전에 따로 뽑은 표본, 정답 독립 확인 반영판)
# 만든 방법: 스크립트로 뽑았다(시드 1114). rset_v1 층 b와 같은 방법: 문서 9개에서 본문 100자 이상인 단위를 고루 뽑고(큰 문서 둘 3개, 나머지 2개,
#   한 조문에서 하나), 본문만 보고 모델(sonnet)이 질문을 썼다. 검색 결과는 보여 주지 않았다. 조문 번호와 법령 이름은 질문에 없다(코드로 검사).
#   뺀 것: rset_v1 층 a·b, rset_a2, rset_a3에 쓰인 조문, 평가셋 v2 정답 조문, 삭제 조문.
# 정답(gold)은 답이 든 단위(source_unit)의 조·항(호·목 포함). 다른 조문을 가리키기만 하는 조문을 정답으로 두지 않는다.
# 한계: 질문을 정답 본문을 보고 썼다(본문 낱말이 질문에 들어가 검색에 유리하게 치우친다). 정답은 한 조·항뿐이다. 20문항(한 문항 0.05). 화물 번호 없음.
# 정답 독립 확인(문항을 만들지 않은 쪽이 20문항을 코퍼스 본문과 대조): 맞음 9, 고침 11, 버림 0.
#   정답 좁힘(같은 조·항의 다른 호가 다른 내용이라 답이 든 호·목으로): Q02, Q06, Q09, Q10, Q11, Q14, Q15, Q17, Q19.
#   also_ok(이것을 찾아도 맞음): Q05, Q12. 질문 고침: Q12. importer_question: false = 수입자의 질문이 아님(Q07, Q12, Q15).
